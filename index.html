<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex</title>

    <!-- Normalize CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
        integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Font Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;500;700&display=swap" rel="stylesheet">

    <!-- Nosso CSS -->
    <link rel="stylesheet" href="/assets/css/global.css">
    <link rel="stylesheet" href="/assets/css/pokedex.css">
</head>

<body>
    <section class="content">
        <header class="app-header">
            <h1>Pokédex</h1>
            <button id="themeToggle" class="icon-btn" type="button" title="Alternar tema"
                aria-label="Alternar tema claro/escuro">🌙</button>
        </header>

        <div class="toolbar">
            <input id="searchInput" class="search" type="search"
                placeholder="Buscar por nome ou número..." aria-label="Buscar Pokémon">

            <select id="typeFilter" class="type-filter" aria-label="Filtrar por tipo"></select>

            <button id="favoritesToggle" class="chip" type="button">★ Favoritos</button>

            <span id="teamCounter" class="team-counter">Time 0/6</span>
        </div>

        <div id="statusArea" class="status-area" aria-live="polite"></div>

        <ol id="pokemonList" class="pokemons">
            <!-- Pokémon renderizados aqui -->
        </ol>

        <div class="pagination">
            <button id="loadMoreButton" type="button">
                Carregar mais
            </button>
        </div>
    </section>

    <!-- Modal de detalhes -->
    <div id="detailModal" class="modal" aria-hidden="true" role="dialog" aria-modal="true"
        aria-labelledby="modalBody">
        <div class="modal-box">
            <button id="modalClose" class="modal-close icon-btn" type="button"
                aria-label="Fechar">✕</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Nosso JS (ES Modules) -->
    <script type="module" src="/assets/js/main.js"></script>
</body>

</html>
